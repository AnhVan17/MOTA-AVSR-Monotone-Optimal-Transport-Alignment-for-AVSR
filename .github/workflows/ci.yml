name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install minimal CPU deps (unit tests are GPU/network-free)
        run: |
          python -m pip install --upgrade pip
          # torch CPU wheel keeps the job light (no CUDA download)
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          # webdataset is needed: src/data/shards.py imports it (tests/unit/test_webdataset.py)
          pip install "numpy<2" pyyaml pytest ruff webdataset==0.2.79

      - name: Ruff (syntax errors + pyflakes)
        run: ruff check src tests scripts

      - name: Pytest (unit)
        run: pytest tests/ -q
