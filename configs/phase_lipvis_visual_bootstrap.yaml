# Visual bootstrap continuation after the first force-visual probe.
#
# Goal: make the lip path learn a direct transcript signal before MQOT. This keeps the normal AV
# objective active, but adds a lightweight CTC head on the visual timeline so we can measure whether
# visual-only is no longer a dead branch.
defaults:
  - phase_lipvis_force

model:
  use_visual_ctc_aux: true

augmentation:
  # Keep full-modality dropout off for this phase: the direct visual CTC head should never be trained
  # on an accidentally zeroed visual stream. Audio noise remains on so AV robustness is still tested.
  prob: 0.5
  noise_std: 0.15
  time_mask_param: 20
  freq_mask_param: 96
  modality_dropout_prob: 0.0
  visual_prob: 0.3

training:
  pretrained_path: /mnt/checkpoints/lipvis_force_visual/epoch_3.pt
  resume: true
  num_epochs: 8
  learning_rate: 2.0e-5
  min_lr: 2.0e-6
  warmup_steps: 500
  accum_steps: 2

  visual_backbone_lr: 1.0e-6
  visual_unfreeze_at_start: true
  freeze_quality_gate_for_visual_force: false

  # New bootstrap objective: direct CTC from visual features before fusion.
  visual_ctc_loss_weight: 0.3
  visual_ctc_warmup_epochs: 1
  visual_ctc_start_epoch: 0

  # Keep the old visual-only fusion objective as a weaker pressure, not the main intervention.
  visual_only_loss_weight: 0.15
  visual_only_warmup_epochs: 1
  visual_only_start_epoch: 0

  # Preserve an audio anchor so the AV model does not forget the strong ASR path.
  audio_only_loss_weight: 0.1
  audio_only_warmup_epochs: 1
  audio_only_start_epoch: 0

logging:
  checkpoint_dir: /mnt/checkpoints/lipvis_visual_bootstrap
  wandb_name: lipvis-visual-bootstrap-v1
  wandb_id: lipvis-visual-bootstrap-v1
