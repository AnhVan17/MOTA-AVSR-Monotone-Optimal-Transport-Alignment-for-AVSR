# Trial config — validate the NEW model logic (MQOT optimal-transport + fine_align_gate)
# on Modal. Inherits phase2_mqot (use_mqot + mqot params), shrunk to a safe smoke run:
#   - tiny data (max_samples) + 1 epoch keep credit cost minimal
#   - batch_size small: Sinkhorn OT is memory-heavy
#   - pretrained_path -> the phase1 TRIAL checkpoint (strict=False: MQOT params init fresh),
#     mirroring the real phase1 -> phase2 fine-tune flow
#   - isolated checkpoint_dir so we DON'T touch the team's checkpoints/phase2
defaults:
  - phase2_mqot

data:
  train_manifest: "/mnt/vicocktail_features/avvn-test_snr_0_interferer_1-000000_manifest.jsonl"
  val_manifest: "/mnt/vicocktail_features/avvn-test_snr_0_interferer_1-000000_manifest.jsonl"
  data_root: "/mnt/vicocktail_features/avvn-test_snr_0_interferer_1-000000"
  max_samples: 32
  batch_size: 4

training:
  num_epochs: 1
  pretrained_path: "/mnt/checkpoints/phase1_trial/best_model.pt"

logging:
  checkpoint_dir: "/mnt/checkpoints/phase2_trial"
