# Base Configuration
# Shared defaults for all training phases

model:
  # Architecture Defaults
  audio_dim: 768 # Whisper encoder output
  visual_dim: 512 # ResNet18 output
  d_model: 256
  num_encoder_layers: 4
  num_decoder_layers: 2
  num_heads: 4
  vocab_size: 2000 # Vietnamese SentencePiece (compact; ViCocktail uses 2057). MUST match the SP model.
  blank_id: 4 # <blank> CTC id in the SP model (loss/decoder derive from tokenizer.eot_token_id)
  dropout: 0.1

  # Flags
  use_mqot: false # Default: Disabled
  use_backbones: false # Visual ResNet on raw frames; set true for WebDataset frame shards
  use_audio_backbone: false # Whisper on RAW audio; off — shards store precomputed Whisper feats
  visual_pretrained: true # ResNet18 ImageNet weights; false = from-scratch / offline tests

tokenizer:
  type: sentencepiece # 'sentencepiece' (Vietnamese ~2000) | 'whisper' (51865, GRID/legacy)
  model_path: assets/tokenizer/vi_sp_2000.model
  language: vi

loss:
  ctc_weight: 0.3
  ce_weight: 0.7

data:
  # Default Paths (Override in specific configs if needed)
  train_manifest: "/mnt/manifests/train_manifest.jsonl"
  val_manifest: "/mnt/manifests/val_manifest.jsonl"
  data_root: "/mnt/processed_features/grid"

  batch_size: 32
  num_workers: 2
  prefetch_factor: 4 # batches prefetched per worker (smoother GPU feed; applied only when num_workers>0)
  persistent_workers: true # keep dataloader workers alive across epochs (avoid respawn cost)
  use_precomputed_features: true
  max_samples: null
  samples_per_epoch: null # approx clips/epoch → train progress-bar total (tqdm); null = bare "Nit" count

training:
  seed: 42
  num_epochs: 20
  learning_rate: 1e-4
  min_lr: 1e-5 # Increased from 1e-6
  warmup_steps: 100 # Decreased from 1000 for small dataset
  weight_decay: 0.01
  gradient_clip: 5.0
  use_amp: true
  pretrained_path: null # weights-only warm-start (cross-phase P1→P2, strict=False)
  resume: false # true → auto-resume latest epoch_*.pt in checkpoint_dir (full state: optim+sched+epoch)
  resume_path: null # explicit checkpoint to resume from (overrides `resume` auto-discovery)

augmentation:
  # Audio
  time_mask_param: 10
  freq_mask_param: 64
  noise_std: 0.01
  prob: 0.0
  # Visual
  dropout_prob: 0.1
  frame_mask_param: 5
  visual_prob: 0.3

logging:
  use_wandb: false
  wandb_project: "mota-avsr"
  wandb_name: null
  wandb_id: null # fixed id (set in phase1.yaml) → resume reconnects to the SAME run across containers
  wandb_resume: allow
  log_interval: 50 # wandb per-step logging cadence (in steps)
  train_wer_interval: 500 # periodic CTC-greedy train WER (early in-epoch signal; 0=off)
  checkpoint_dir: "/mnt/checkpoints"
