# Force-visual continuation run for phase_lipvis.
#
# Goal: warm-start from the lipvis checkpoint where AV ~= audio-only, then make the visual branch
# receive a direct lip-reading objective instead of waiting for the main AV loss to discover it.
# First launch: checkpoint_dir is empty -> load pretrained_path. Relaunches: resume=true picks the
# latest force-visual checkpoint and keeps optimizer/scheduler state.
defaults:
  - phase_lipvis

augmentation:
  # Keep this first force run low-variance: the explicit visual-only objective is the intervention.
  # High random modality dropout can itself create modality bias, so leave it off here.
  prob: 0.5
  noise_std: 0.1
  time_mask_param: 10
  freq_mask_param: 64
  modality_dropout_prob: 0.0
  visual_prob: 0.3

data:
  # Visual/audio auxiliary forwards keep extra graphs before backward. Use smaller per-step batch to
  # avoid VRAM spikes, then recover the old effective batch with accumulation.
  # batch16 x accum2 keeps the old effective batch32, but halves WebDataset micro-batches/epoch
  # versus batch8 x accum4.
  batch_size: 16
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: false

training:
  pretrained_path: /mnt/checkpoints/lipvis/epoch_15.pt
  resume: true
  num_epochs: 15
  learning_rate: 5.0e-5
  min_lr: 5.0e-6
  warmup_steps: 500
  accum_steps: 2

  # Open the trainable visual last block immediately, but with a low LR.
  visual_backbone_lr: 3.0e-6
  visual_unfreeze_at_start: true
  freeze_quality_gate_for_visual_force: false

  # Main intervention: direct visual-only AVSR loss. Warm it in over three epochs to avoid a sudden
  # loss-scale jump from the warm-started AV model.
  visual_only_loss_weight: 0.3
  visual_only_warmup_epochs: 3
  visual_only_start_epoch: 0

  # Small ASR anchor: smoke tests showed visual forcing alone can collapse the audio-only ablation.
  audio_only_loss_weight: 0.1
  audio_only_warmup_epochs: 1
  audio_only_start_epoch: 0

logging:
  checkpoint_dir: /mnt/checkpoints/lipvis_force_visual
  wandb_name: lipvis-force-visual-v1
  wandb_id: lipvis-force-visual-v1
