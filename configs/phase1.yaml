# Phase 1 — QualityGate-only baseline (use_mqot=false) on the WebDataset FRAME shards.
# Inherits base.yaml; overrides data → webdataset frame shards, and turns the visual backbone on.
defaults:
  - base

model:
  use_backbones: true # frame shards yield raw frames [T,C,H,W] → ResNet runs at train time

training:
  resume: true # 20 epochs > one Modal container → relaunch auto-resumes latest checkpoint

loss:
  ctc_weight: 0.5
  ce_weight: 0.5

data:
  format: webdataset
  train_shards: "/mnt/vicocktail_features/vicocktail-avvn-train-*.tar"
  val_shards: "/mnt/vicocktail_features/vicocktail-avvn-test-000000-*.tar" # clean test (process test sets first)
  batch_size: 16
  num_workers: 4 # 2→4: more parallel frame decode — GPU was data-bound (59% util on A10G)
  shuffle_buffer: 1000 # halved so RAM stays ~same with 2× workers (4×1000 ≈ 2×2000 buffered)
  samples_per_epoch: 194073 # ViCocktail train clips (≈ sum of shard _meta.json) → progress-bar total

logging:
  use_wandb: true
  wandb_name: "phase1-vi-sp2000"
  wandb_id: "phase1-vi-sp2000" # fixed → multi-container resume continues ONE wandb run (not a new run each relaunch)
  checkpoint_dir: "/mnt/checkpoints/phase1"
